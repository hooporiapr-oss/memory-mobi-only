<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ritnome Memory · Enter Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#ff1e3c;--red-deep:#c8102e;--dark:#0a0a0f;--text:#fff;--muted:#8892a0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow:hidden}

#strobe{position:fixed;inset:0;z-index:1;pointer-events:none;background:var(--red);opacity:0;transition:opacity .07s ease-out}
#dots{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.beat-dot{position:absolute;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff6b7f,var(--red));box-shadow:0 0 28px rgba(255,30,60,.9);opacity:0}
@keyframes beatDotFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(.5)}}

#center{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.logoImg{width:100%;max-width:340px;height:auto;margin-bottom:24px;filter:drop-shadow(0 0 30px rgba(255,30,60,.35))}

.code-panel{width:100%;max-width:340px}
.code-label{font-size:.68rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.code-note{font-size:.68rem;color:var(--muted);margin-bottom:16px;line-height:1.4}
.code-input{width:100%;padding:16px;border-radius:10px;border:2px solid rgba(255,30,60,.4);background:rgba(255,255,255,.06);color:#fff;font-size:1.5rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;text-align:center;font-family:'Courier New',monospace}
.code-input:focus{outline:none;border-color:var(--red);box-shadow:0 0 24px rgba(255,30,60,.3)}
.code-input.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

.enter-btn{width:100%;margin-top:16px;padding:15px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;font-size:.9rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.err{margin-top:14px;color:#ff8888;font-size:.82rem;font-weight:700;min-height:18px}
.brandmark{margin-top:40px;font-size:.68rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:#4a5058}
.brandmark b{color:var(--muted);font-style:italic}
</style>
</head>
<body>

<div id="strobe"></div>
<div id="dots"></div>

<div id="center">
  <img class="logoImg" src="ready-hooporia.png" alt="Ritnome">

  <div class="code-panel">
    <div class="code-label">Access Code</div>
    <div class="code-note">One-time entry — enter your code once and this device stays unlocked, so practicing from home stays quick.</div>
    <input class="code-input" id="gate-code" maxlength="12" placeholder="• • • •" autocomplete="off" onkeydown="if(event.key==='Enter')tryEnter()">
    <button class="enter-btn" onclick="tryEnter()">Unlock This Device →</button>
    <div class="err" id="gate-err"></div>
  </div>

  <div class="brandmark">Powered by <b>Gostar Digital</b></div>
</div>

<script>
var $=function(id){return document.getElementById(id)};

// ══════════════════════════════════════════════════════
//  LICENSE SYSTEM — codes are checked against Supabase.
//  To issue / expire / revoke codes, use admin.html
//  (the Mobile tab). No file edits needed.
//
//  This gate is scoped to product='mobile' — a code issued
//  for Ritnome or Hooporia will NOT unlock this gate, and
//  a mobile code won't unlock those, even though all three
//  live in the same licenses table.
//
//  Unlike the desktop/VR gates, this one persists in
//  localStorage (not sessionStorage) — deliberately, since
//  the whole point of the mobile site is quick, low-friction
//  practice from home. A student enters the code once per
//  device, ever, not once per visit.
// ══════════════════════════════════════════════════════
var SUPABASE_URL = 'https://sdaphocueugzfvjovuxd.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var PRODUCT = 'mobile';
// ══════════════════════════════════════════════════════

// If this device already unlocked once, skip straight through —
// no need to ever ask again on this device.
if (localStorage.getItem('rct-mobile-pass') === '1') {
  window.location.replace('mobile-lab.html');
}

function tryEnter(){
  var input = $('gate-code').value.trim();
  if (!input){ return; }
  $('gate-err').style.color = '';
  $('gate-err').textContent = 'Checking…';

  var url = SUPABASE_URL + '/rest/v1/licenses'
    + '?select=code,expires_at,active,product'
    + '&code=ilike.' + encodeURIComponent(input)
    + '&active=eq.true'
    + '&product=eq.' + PRODUCT;

  fetch(url, {
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
    }
  })
  .then(function(r){ return r.json(); })
  .then(function(rows){
    var lic = (rows && rows.length) ? rows[0] : null;

    if (!lic){ return reject('Invalid code — check with your administrator'); }

    if (lic.expires_at){
      var exp = new Date(lic.expires_at + 'T23:59:59');
      if (new Date() > exp){ return reject('This license has expired'); }
    }

    // valid → unlock this device permanently, then enter
    localStorage.setItem('rct-mobile-pass','1');
    localStorage.setItem('rct-mobile-license', input.toUpperCase());
    window.location.href = 'mobile-lab.html';
  })
  .catch(function(){
    reject('Connection problem — please try again');
  });
}

function reject(msg){
  $('gate-err').style.color = '#ff8888';
  $('gate-err').textContent = msg;
  var box = $('gate-code');
  box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  box.value=''; box.focus();
}

// ── 120 beat: visual (strobe + flying red dots), matching the hub's own ambient effect ──
var BPM = 120, beatMs = 60000/BPM;
function beatTick(){
  var st=$('strobe'); if(st){st.style.opacity='.10'; setTimeout(function(){st.style.opacity='0'},80)}
  spawnDot();
}
function spawnDot(){
  var layer=$('dots'); if(!layer) return;
  var d=document.createElement('div');
  d.className='beat-dot';
  d.style.left=(8+Math.random()*84)+'%';
  d.style.top=(8+Math.random()*74)+'%';
  var dur=Math.round(beatMs*0.95);
  d.style.animation='beatDotFly '+dur+'ms ease-out forwards';
  layer.appendChild(d);
  setTimeout(function(){ if(d&&d.parentNode) d.parentNode.removeChild(d) }, dur+60);
}
setInterval(beatTick, beatMs);
beatTick();

$('gate-code').focus();
</script>
</body>
</html>
