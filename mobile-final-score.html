<!DOCTYPE html>
<html lang="en">
<head>
<script>
if (localStorage.getItem('rct-mobile-pass') !== '1') {
  window.location.replace('index.html');
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Final Score — Ritnome Memory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#ff1e3c;--red-deep:#c8102e;--dark:#0a0a0f;--card:#111118;--text:#fff;--muted:#8892a0;--border:rgba(255,255,255,0.1);--purple:#9B59B6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Outfit',sans-serif;background:var(--dark);color:var(--text);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overflow-x:hidden}

#stage{position:relative;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
#panel{width:100%;max-width:460px;text-align:center}

.buzzer{font-size:.68rem;font-weight:900;letter-spacing:.3em;text-transform:uppercase;color:var(--purple);margin-bottom:8px}
.final-title{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;text-transform:uppercase;color:#fff;text-shadow:0 0 32px rgba(255,30,60,.7);margin-bottom:26px}
.final-title span{color:var(--red)}

.qs-board{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%;max-width:340px;margin:0 auto 22px}
.qs-cell{border-radius:12px;border:2px solid rgba(255,30,60,.35);background:rgba(255,30,60,.06);padding:16px 4px}
.qs-label{font-size:.58rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#ffd35a;margin-bottom:5px}
.qs-val{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:#fff}

.total-row{
  border-radius:18px;border:2px solid rgba(155,89,182,.5);
  background:linear-gradient(135deg,rgba(155,89,182,.18),rgba(255,255,255,.03));
  padding:22px;margin-bottom:26px;box-shadow:0 0 40px rgba(155,89,182,.35);
}
.total-label{font-size:.68rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#c79ee0;margin-bottom:6px}
.total-val{font-family:'Bebas Neue',sans-serif;font-size:2.8rem;color:#fff;text-shadow:0 0 26px rgba(155,89,182,.7)}

.action-btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:56px;border:none;border-radius:16px;
  font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1.5px;
  text-transform:uppercase;cursor:pointer;text-decoration:none;margin-bottom:12px;
}
.action-btn:active{transform:scale(.98)}
.action-btn.primary{background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;box-shadow:0 0 30px rgba(255,30,60,.6)}
.action-btn.secondary{background:rgba(255,255,255,.06);color:#fff;border:1px solid var(--border)}
.action-btn.disabled{opacity:.35;pointer-events:none}

.hub-foot{text-align:center;margin-top:18px;font-size:.6rem;font-weight:900;letter-spacing:.24em;text-transform:uppercase;color:#4a5058}
.hub-foot b{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div id="stage">
  <div id="panel">
    <div class="buzzer">🔔 Final Buzzer</div>
    <div class="final-title">GAME <span>COMPLETE</span></div>

    <div class="qs-board">
      <div class="qs-cell"><div class="qs-label">1st Half</div><div class="qs-val" id="fsH1">0</div></div>
      <div class="qs-cell"><div class="qs-label">2nd Half</div><div class="qs-val" id="fsH2">0</div></div>
    </div>

    <div class="total-row">
      <div class="total-label">Final Score</div>
      <div class="total-val" id="fsTotal">0</div>
    </div>

    <a class="action-btn primary disabled" id="playAgainBtn" href="/002-recall.html">🏀 Play Again — Both Halves</a>
    <a class="action-btn secondary disabled" id="viewStandingsLink" href="/mobile-standings-index.html">🏆 View Standings</a>
    <a class="action-btn secondary disabled" id="backToHubLink" href="/mobile-lab.html">← Back to the Hub</a>

    <div id="standingsStatus" style="font-size:.72rem;font-weight:700;letter-spacing:.04em;color:#8892a0;margin:-4px 0 14px">Saving to standings…</div>

    <div class="hub-foot">Powered by <b>Gostar Digital</b></div>
  </div>
</div>
<script>
(function(){
function loadHalfScores(){
  try{return JSON.parse(sessionStorage.getItem('rct-mobile-half-scores')||'{"h1":0,"h2":0}')}
  catch(e){return {h1:0,h2:0}}
}
var scores=loadHalfScores();
var total=scores.h1+scores.h2;
document.getElementById('fsH1').textContent=scores.h1;
document.getElementById('fsH2').textContent=scores.h2;
document.getElementById('fsTotal').textContent=total;

document.getElementById('playAgainBtn').addEventListener('click',function(){
  sessionStorage.setItem('rct-mobile-fullgame-active','1');
  sessionStorage.setItem('rct-mobile-half-scores',JSON.stringify({h1:0,h2:0}));
});

// ══════════════════════════════════════════════════════
//  STANDINGS — one single board for the whole two-half run, not
//  per-half. Written exactly once, here, the moment a run
//  genuinely completes — neither of the two individual half games
//  write anything to this table themselves.
//
//  The save status is shown directly on screen rather than only in
//  the console — a silent failure here is useless for actually
//  diagnosing anything, so success or failure is visible without
//  needing dev tools open at all.
// ══════════════════════════════════════════════════════
var SUPABASE_URL='https://sdaphocueugzfvjovuxd.supabase.co';
var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYXBob2N1ZXVnemZ2am92dXhkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MjQyMDgsImV4cCI6MjA5OTIwMDIwOH0.pDAzf4P6dD9eNEBlnP95SdF5BI-R84-Rdc0vKzYcn7M';
var SB_TABLE='ritnome_mobile_2halves_standings';
var statusEl=document.getElementById('standingsStatus');

// Defensive coercion — if either half score ever came through as
// something other than a clean number, sending that straight to an
// integer NOT NULL column would get the whole insert rejected.
function toInt(v){ var n=Number(v); return isFinite(n) ? Math.round(n) : 0; }
var payload={
  player_name:(sessionStorage.getItem('rct-mobile-player-name')||'Player').slice(0,40),
  h1_score:toInt(scores.h1),
  h2_score:toInt(scores.h2),
  total_score:toInt(total)
};

saveToStandings(payload);

// Navigation stays disabled only for the brief window the save is
// actually in flight — leaving the page (tapping any of the three
// buttons above) can abort a pending fetch before it completes,
// which is exactly what was silently losing scores. A hard timeout
// guarantees nobody's ever stuck waiting if the network hangs.
var navUnlocked=false;
function unlockNavigation(){
  if(navUnlocked)return;
  navUnlocked=true;
  document.getElementById('playAgainBtn').classList.remove('disabled');
  document.getElementById('viewStandingsLink').classList.remove('disabled');
  document.getElementById('backToHubLink').classList.remove('disabled');
}
setTimeout(unlockNavigation,6000);

async function saveToStandings(payload){
  try{
    var res=await fetch(SUPABASE_URL+'/rest/v1/'+SB_TABLE,{
      method:'POST',
      headers:{
        'apikey':SUPABASE_ANON_KEY,
        'Authorization':'Bearer '+SUPABASE_ANON_KEY,
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify(payload)
    });
    if(res.ok){
      statusEl.textContent='✓ Saved to standings';
      statusEl.style.color='#00D9A5';
    }else{
      var bodyText=await res.text().catch(function(){return ''});
      console.error('Mobile Dynamic Memory standings write failed:',res.status,bodyText);
      statusEl.textContent='⚠ Couldn\'t save (error '+res.status+') — score still stands above, just not on the board';
      statusEl.style.color='#FF6B35';
    }
  }catch(e){
    console.error('Mobile Dynamic Memory standings write — network error:',e);
    statusEl.textContent='⚠ Couldn\'t reach the standings server — score still stands above, just not on the board';
    statusEl.style.color='#FF6B35';
  }finally{
    unlockNavigation();
  }
}
})();
</script>
</body>
</html>
